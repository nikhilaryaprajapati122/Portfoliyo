<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Office Portfolio</title>

  <!-- Google Fonts: clean + display -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />

  <!-- Our theme -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- 3D scene canvas yahin banega -->
  <div id="scene-container" aria-hidden="true"></div>

  <!-- Subtle vignette for daylight feel -->
  <div class="fx-vignette"></div>
  <div class="fx-scanlines"></div>

  <!-- Glitch flash overlay (world switch par) -->
  <div class="fx-glitch" id="fx-glitch" aria-hidden="true"></div>

  <!-- ===== UI OVERLAY ===== -->
  <div class="ui-overlay">

    <!-- Top header -->
    <header class="glass top-bar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name" id="brand-name">Portfolio</span>
        <span class="brand-role" id="brand-role"></span>
      </div>
      <nav class="top-actions">
        <button class="ghost-btn" data-section="about">About</button>
        <button class="ghost-btn" data-section="skills">Skills</button>
        <button class="ghost-btn" data-section="se">📘 SE</button>
        <button class="ghost-btn" data-section="projects">Projects</button>
        <button class="ghost-btn" data-section="contact">Contact</button>
        <button class="neon-btn" id="open-assistant">🤖 Assistant</button>
      </nav>
    </header>

    <!-- Intro / title card (hidden after intro) -->
    <section class="glass intro-card" id="intro-card">
      <h1 class="neon-text" id="intro-title">Welcome</h1>
      <p class="intro-sub" id="intro-sub">3D experience load ho rahi hai…</p>
      <button class="neon-btn big" id="skip-intro">Enter Portfolio →</button>
    </section>

    <!-- Speech bubble: 3D person poochhega kya dekhna hai -->
    <section class="glass speech-bubble hidden" id="speech-bubble">
      <div class="avatar" id="person-avatar">🧑‍💼</div>
      <p class="speech-text" id="speech-text">नमस्ते! आप क्या देखना चाहेंगे?</p>
      <div class="topic-row" id="topic-row">
        <button class="topic-btn" data-topic="about">🙋 About</button>
        <button class="topic-btn" data-topic="skills">🛠️ Skills</button>
        <button class="topic-btn" data-topic="se">📘 SE Concepts</button>
        <button class="topic-btn" data-topic="projects">🚀 Projects</button>
        <button class="topic-btn" data-topic="contact">📬 Contact</button>
      </div>
    </section>

    <!-- Bottom hint -->
    <div class="hint" id="hint">Tip: 🖱️ drag = camera ghumao • scroll = zoom</div>

  </div>

  <!-- ===== SECTION MODAL (About / Skills / Projects / Contact) ===== -->
  <div class="modal-backdrop hidden" id="section-modal">
    <div class="glass modal">
      <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
      <button class="back-lobby" id="back-lobby">← Lobby</button>
      <h2 class="neon-text" id="modal-title">Title</h2>
      <div class="modal-body" id="modal-body"><!-- content yahan aaega --></div>
    </div>
  </div>

  <!-- ===== AI ASSISTANT PANEL ===== -->
  <aside class="glass assistant hidden" id="assistant">
    <header class="assistant-head">
      <span class="bot-badge">🤖</span>
      <div>
        <strong>Portfolio Assistant</strong>
        <small>Hindi / English • tools + install bhi bataega</small>
      </div>
      <button class="modal-close" id="assistant-close" aria-label="Close">✕</button>
    </header>

    <div class="chat-log" id="chat-log"><!-- messages yahan --></div>

    <div class="chat-quick" id="chat-quick">
      <button class="quick-btn" data-q="kaise ho">Kaise ho?</button>
      <button class="quick-btn" data-q="boss ka naam">Boss?</button>
      <button class="quick-btn" data-q="kis company me kaam karte ho">Company?</button>
      <button class="quick-btn" data-q="sdlc">SDLC?</button>
      <button class="quick-btn" data-q="agile">Agile?</button>
      <button class="quick-btn" data-q="kaun si languages aati hain">Languages?</button>
      <button class="quick-btn" data-q="tools">Tools?</button>
      <button class="quick-btn" data-q="node kaise install karu">Node install?</button>
    </div>

    <form class="chat-input-row" id="chat-form">
      <input type="text" id="chat-input" placeholder="Pucho… e.g. React kaise install karu?" autocomplete="off" />
      <button class="neon-btn" type="submit">Send</button>
    </form>
  </aside>

  <!-- ===== SCRIPTS (classic tags: file:// + GitHub dono par chalega) ===== -->
  <!-- Three.js (CDN, UMD build) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- App files (order matter karta hai) -->
  <script src="data/content.js"></script>
  <script src="js/assistant.js"></script>
  <script src="js/scene3d.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
